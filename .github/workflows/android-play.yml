# Upload Master Metabolic to the Play internal track.
#
# Dispatch only. This file does not run on pull requests or pushes.
# Run it the same way as TestFlight: Actions → Android Play → Run workflow.
# The job checks out main and builds that commit. It does not create GitHub
# secrets, a keystore, or a Play service-account JSON, and it does not change
# Play Billing. versionCode and versionName are set on the runner. They are
# not committed.
#
# Repository secrets this file reads:
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON_BASE64
#   GOOGLE_SERVICES_JSON_BASE64
#   VITE_API_URL
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET
#   VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID
#   VITE_FIREBASE_VAPID_KEY
#   VITE_SMS_PHONE_NUMBER (optional; written empty when unset)

name: Android Play

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode. Empty = one higher than the highest version code already on Play (minimum 1).'
        required: false
        type: string
      version_name:
        description: 'versionName. Stays 1.0 unless you set this.'
        required: false
        default: '1.0'
        type: string

permissions:
  contents: read

concurrency:
  group: android-play
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_NAME: com.mastermetabolic.app

    steps:
      # Job env cannot use the runner context. Later steps read these paths from the environment.
      - name: Remember signing paths
        run: |
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          echo "PLAY_SA_PATH=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remember the main SHA
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Require the committed Android project
        run: |
          set -euo pipefail
          if [[ ! -f client/android/gradlew || ! -f client/android/app/build.gradle ]]; then
            echo "::error::main does not contain client/android. Commit the Capacitor Android project before dispatching."
            exit 1
          fi
          if ! grep -q 'applicationId "com.mastermetabolic.app"' client/android/app/build.gradle; then
            echo "::error::applicationId in client/android/app/build.gradle must be com.mastermetabolic.app."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK" || ! -d "$SDK" ]]; then
            echo "::error::ubuntu-latest should include the Android SDK. ANDROID_SDK_ROOT is unset."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" && -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager is not on this runner."
            exit 1
          fi
          mkdir -p "$SDK/licenses"
          printf '%s\n' "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36"
          printf 'sdk.dir=%s\n' "$SDK" > client/android/local.properties

      - name: Write the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "::error::Derek must add repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD. This workflow does not create them."
            exit 1
          fi
          node --input-type=module << 'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';

          for (const name of ['ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']) {
            if (/[\r\n]/.test(process.env[name] || '')) {
              console.error(name + ' contains a newline');
              process.exit(1);
            }
          }
          const raw = (process.env.ANDROID_KEYSTORE_BASE64 || '').replace(/\s/g, '');
          const decoded = Buffer.from(raw, 'base64');
          const isJks = decoded.length > 4
            && decoded[0] === 0xfe && decoded[1] === 0xed && decoded[2] === 0xfe && decoded[3] === 0xed;
          const isPkcs12 = decoded.length > 4 && decoded[0] === 0x30;
          if (!isJks && !isPkcs12) {
            console.error('ANDROID_KEYSTORE_BASE64 must be base64 of the upload .jks or .keystore, not the raw file pasted into YAML.');
            process.exit(1);
          }
          const keystorePath = process.env.ANDROID_KEYSTORE_PATH;
          writeFileSync(keystorePath, decoded, { mode: 0o600 });

          const password = process.env.ANDROID_KEYSTORE_PASSWORD;
          const alias = process.env.ANDROID_KEY_ALIAS;
          try {
            execFileSync('keytool', [
              '-list',
              '-keystore', keystorePath,
              '-storepass', password,
              '-alias', alias,
            ], { stdio: ['ignore', 'ignore', 'pipe'] });
          } catch (error) {
            const stderr = Buffer.isBuffer(error.stderr) ? error.stderr.toString('utf8') : '';
            const redacted = stderr.split(password).join('[redacted]').split(alias).join('[redacted]');
            console.error(redacted.trim() || 'keytool rejected the upload keystore');
            process.exit(1);
          }
          JS

      - name: Write the Play service account
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${PLAY_SERVICE_ACCOUNT_JSON_BASE64}" ]]; then
            echo "::error::Derek must add repository secret PLAY_SERVICE_ACCOUNT_JSON_BASE64 (base64 of the Play Console service-account JSON). This workflow does not create it."
            exit 1
          fi
          node --input-type=module << 'JS'
          import { writeFileSync } from 'node:fs';

          const raw = (process.env.PLAY_SERVICE_ACCOUNT_JSON_BASE64 || '').replace(/\s/g, '');
          const decoded = Buffer.from(raw, 'base64');
          let account;
          try {
            account = JSON.parse(decoded.toString('utf8'));
          } catch {
            console.error('PLAY_SERVICE_ACCOUNT_JSON_BASE64 must be base64 of the service-account JSON, not the raw JSON pasted into YAML.');
            process.exit(1);
          }
          const privateKey = typeof account.private_key === 'string' ? account.private_key : '';
          const email = typeof account.client_email === 'string' ? account.client_email : '';
          if (account.type !== 'service_account' || !email.includes('@') || !privateKey.includes('BEGIN PRIVATE KEY')) {
            console.error('PLAY_SERVICE_ACCOUNT_JSON_BASE64 must be a Google service-account JSON with client_email and private_key.');
            process.exit(1);
          }
          writeFileSync(process.env.PLAY_SA_PATH, decoded, { mode: 0o600 });
          JS

      - name: Resolve version name and version code
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          node --input-type=module << 'JS'
          import { createSign } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';

          const packageName = process.env.PACKAGE_NAME;
          const versionNameInput = (process.env.INPUT_VERSION_NAME || '').trim() || '1.0';
          if (!/^[0-9]+(\.[0-9]+){1,2}$/.test(versionNameInput)) {
            console.error('version_name must look like 1.0');
            process.exit(1);
          }

          function base64url(value) {
            const buffer = Buffer.isBuffer(value) ? value : Buffer.from(value);
            return buffer.toString('base64url');
          }

          function redact(text) {
            return String(text)
              .replace(/-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----/g, '[redacted]')
              .slice(0, 500);
          }

          async function playMessage(response) {
            const text = await response.text();
            if (!text) return '';
            try {
              const json = JSON.parse(text);
              const status = json.error?.status || '';
              const message = json.error?.message || json.error_description || '';
              return redact([status, typeof message === 'string' ? message : ''].filter(Boolean).join(': '));
            } catch {
              return redact(text);
            }
          }

          async function accessToken(account) {
            const now = Math.floor(Date.now() / 1000);
            const header = base64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
            const payload = base64url(JSON.stringify({
              iss: account.client_email,
              scope: 'https://www.googleapis.com/auth/androidpublisher',
              aud: 'https://oauth2.googleapis.com/token',
              iat: now,
              exp: now + 3600,
            }));
            const unsigned = `${header}.${payload}`;
            const signer = createSign('RSA-SHA256');
            signer.update(unsigned);
            signer.end();
            const assertion = `${unsigned}.${base64url(signer.sign(account.private_key))}`;
            const response = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion,
              }),
            });
            if (!response.ok) {
              console.error(`Play service account was rejected (${response.status}). ${await playMessage(response)}`);
              process.exit(1);
            }
            const json = await response.json();
            if (!json.access_token) {
              console.error('Play token response had no access token.');
              process.exit(1);
            }
            return json.access_token;
          }

          function nextVersionCode(tracks, explicit) {
            let max = 0;
            for (const track of tracks) {
              for (const release of track.releases || []) {
                for (const code of release.versionCodes || []) {
                  const value = Number(code);
                  if (Number.isSafeInteger(value) && value > max) max = value;
                }
              }
            }
            const raw = explicit === undefined || explicit === null ? '' : String(explicit).trim();
            if (raw !== '') {
              if (!/^[0-9]+$/.test(raw)) {
                throw new Error('version_code must be a positive integer');
              }
              const code = Number(raw);
              if (!Number.isSafeInteger(code) || code < 1 || code > 2000000000) {
                throw new Error('version_code must be an integer from 1 to 2000000000');
              }
              if (code <= max) {
                throw new Error(`version_code ${code} is not higher than the highest version code already on Play (${max})`);
              }
              return code;
            }
            const next = Math.max(max + 1, 1);
            if (next > 2000000000) {
              throw new Error('no versionCode left under 2000000000');
            }
            return next;
          }

          const account = JSON.parse(readFileSync(process.env.PLAY_SA_PATH, 'utf8'));
          const token = await accessToken(account);
          const editResponse = await fetch(
            `https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${encodeURIComponent(packageName)}/edits`,
            {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: '{}',
            }
          );
          if (editResponse.status === 404) {
            console.error(`Play has no app for ${packageName}, or this service account cannot see it. Create the app in Play Console and invite the service account. This workflow does not create the app.`);
            process.exit(1);
          }
          if (editResponse.status === 401 || editResponse.status === 403) {
            console.error(`Play rejected the service account (${editResponse.status}). Invite it on ${packageName} with permission to release to the internal track. ${await playMessage(editResponse)}`);
            process.exit(1);
          }
          if (!editResponse.ok) {
            console.error(`Play edit failed (${editResponse.status}). ${await playMessage(editResponse)}`);
            process.exit(1);
          }
          const edit = await editResponse.json();
          const tracksResponse = await fetch(
            `https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${encodeURIComponent(packageName)}/edits/${encodeURIComponent(edit.id)}/tracks`,
            { headers: { Authorization: `Bearer ${token}` } }
          );
          if (!tracksResponse.ok) {
            console.error(`Play tracks request failed (${tracksResponse.status}). ${await playMessage(tracksResponse)}`);
            process.exit(1);
          }
          const tracksJson = await tracksResponse.json();
          let versionCode;
          try {
            versionCode = nextVersionCode(tracksJson.tracks || [], process.env.INPUT_VERSION_CODE);
          } catch (error) {
            console.error(error.message);
            process.exit(1);
          }

          appendFileSync(
            process.env.GITHUB_ENV,
            `\nANDROID_VERSION_CODE=${versionCode}\nANDROID_VERSION_NAME=${versionNameInput}\n`
          );
          console.log(`versionName=${versionNameInput} versionCode=${versionCode}`);
          JS

      - name: Write production web env for the bundled shell
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_SMS_PHONE_NUMBER: ${{ secrets.VITE_SMS_PHONE_NUMBER }}
          VITE_GIT_SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -euo pipefail
          node --input-type=module << 'JS'
          import { writeFileSync } from 'node:fs';
          const required = [
            'VITE_API_URL',
            'VITE_FIREBASE_API_KEY',
            'VITE_FIREBASE_AUTH_DOMAIN',
            'VITE_FIREBASE_PROJECT_ID',
            'VITE_FIREBASE_STORAGE_BUCKET',
            'VITE_FIREBASE_MESSAGING_SENDER_ID',
            'VITE_FIREBASE_APP_ID',
            'VITE_FIREBASE_VAPID_KEY',
          ];
          if (!process.env.VITE_SMS_PHONE_NUMBER) {
            console.log('::warning::VITE_SMS_PHONE_NUMBER is not set; writing it empty for the Android web bundle.');
          }
          const missing = required.filter((key) => !process.env[key]);
          if (missing.length) {
            console.error('Missing existing deploy secrets for the Android web bundle: ' + missing.join(', '));
            process.exit(1);
          }
          const keys = [...required, 'VITE_SMS_PHONE_NUMBER', 'VITE_GIT_SHA'];
          const lines = keys.map((key) => {
            const value = process.env[key] ?? '';
            if (/[\r\n]/.test(value)) {
              console.error(key + ' contains a newline');
              process.exit(1);
            }
            return key + '=' + value;
          });
          writeFileSync('client/.env.production', lines.join('\n') + '\n', { mode: 0o600 });
          JS

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_SERVICES_JSON_BASE64}" ]]; then
            echo "::error::Add repository secret GOOGLE_SERVICES_JSON_BASE64 (base64 of client/android/app/google-services.json). This workflow does not create it."
            exit 1
          fi
          node --input-type=module << 'JS'
          import { writeFileSync } from 'node:fs';
          const raw = (process.env.GOOGLE_SERVICES_JSON_BASE64 || '').replace(/\s/g, '');
          const decoded = Buffer.from(raw, 'base64');
          let json;
          try {
            json = JSON.parse(decoded.toString('utf8'));
          } catch {
            console.error('GOOGLE_SERVICES_JSON_BASE64 must be base64 of google-services.json, not the raw JSON pasted into YAML.');
            process.exit(1);
          }
          const packages = (json.client || [])
            .map((client) => client?.client_info?.android_client_info?.package_name)
            .filter(Boolean);
          if (!packages.includes('com.mastermetabolic.app')) {
            console.error('google-services.json has no Android client for com.mastermetabolic.app.');
            process.exit(1);
          }
          writeFileSync('client/android/app/google-services.json', decoded, { mode: 0o600 });
          JS

      - name: Install client dependencies
        run: npm ci -w client --include-workspace-root --include=dev

      - name: Sync the Android shell
        run: npm run cap:sync:android --workspace client

      - name: Set the upload key and version on this runner
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node --input-type=module << 'JS'
          import { readFileSync, writeFileSync } from 'node:fs';

          const path = 'client/android/app/build.gradle';
          let text = readFileSync(path, 'utf8');
          if (text.includes('signingConfigs') || text.includes('storePassword') || text.includes('.jks') || text.includes('.keystore')) {
            console.error('client/android/app/build.gradle already mentions signing material. This workflow adds the upload key on the runner and will not override a committed keystore.');
            process.exit(1);
          }
          const codeMatches = text.match(/versionCode\s+\d+/g) || [];
          const nameMatches = text.match(/versionName\s+"[^"]*"/g) || [];
          if (codeMatches.length !== 1 || nameMatches.length !== 1) {
            console.error('Expected one versionCode and one versionName in client/android/app/build.gradle');
            process.exit(1);
          }
          const versionCode = process.env.ANDROID_VERSION_CODE;
          const versionName = process.env.ANDROID_VERSION_NAME;
          if (!/^[0-9]+$/.test(versionCode || '') || !/^[0-9]+(\.[0-9]+){1,2}$/.test(versionName || '')) {
            console.error('runner versionCode or versionName is missing');
            process.exit(1);
          }
          text = text.replace(/versionCode\s+\d+/, `versionCode ${versionCode}`);
          text = text.replace(/versionName\s+"[^"]*"/, `versionName "${versionName}"`);
          const releasePattern = /^([ \t]*)buildTypes\s*\{\s*release\s*\{/m;
          const releaseMatch = text.match(releasePattern);
          if (!releaseMatch) {
            console.error('app/build.gradle has no buildTypes.release block');
            process.exit(1);
          }
          const indent = releaseMatch[1];
          const signing = [
            `${indent}signingConfigs {`,
            `${indent}    release {`,
            `${indent}        storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))`,
            `${indent}        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")`,
            `${indent}        keyAlias System.getenv("ANDROID_KEY_ALIAS")`,
            `${indent}        keyPassword System.getenv("ANDROID_KEY_PASSWORD")`,
            `${indent}    }`,
            `${indent}}`,
            '',
          ].join('\n');
          text = text.replace(
            releasePattern,
            `${signing}${indent}buildTypes {\n${indent}    release {\n${indent}        signingConfig signingConfigs.release`
          );
          for (const secret of [process.env.ANDROID_KEYSTORE_PASSWORD, process.env.ANDROID_KEY_PASSWORD]) {
            if (secret && text.includes(`"${secret}"`)) {
              console.error('refusing to write a keystore password into build.gradle');
              process.exit(1);
            }
          }
          writeFileSync(path, text);
          JS

      - name: Bundle the release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build-logs
          chmod +x client/android/gradlew
          set +e
          (
            cd client/android
            ./gradlew bundleRelease --no-daemon
          ) 2>&1 | tee build-logs/gradle-bundle.log
          GRADLE_STATUS=${PIPESTATUS[0]}
          set -e
          if [[ "$GRADLE_STATUS" -ne 0 ]]; then
            echo "::error::bundleRelease failed (${GRADLE_STATUS}). See the bundle log."
            exit "$GRADLE_STATUS"
          fi
          AAB="client/android/app/build/outputs/bundle/release/app-release.aab"
          if [[ ! -f "$AAB" ]]; then
            echo "::error::bundleRelease did not write $AAB"
            exit 1
          fi
          jarsigner -verify "$AAB" > build-logs/jarsigner-verify.log 2>&1 || true
          if grep -E -q 'jar is unsigned|unsigned entries' build-logs/jarsigner-verify.log || ! grep -q 'jar verified' build-logs/jarsigner-verify.log; then
            echo "::error::The AAB is not signed. Check the upload keystore secrets."
            exit 1
          fi

      - name: Upload the AAB to the Play internal track
        run: |
          set -euo pipefail
          node --input-type=module << 'JS'
          import { createSign } from 'node:crypto';
          import { readFileSync } from 'node:fs';

          const packageName = process.env.PACKAGE_NAME;
          const versionCode = process.env.ANDROID_VERSION_CODE;
          const versionName = process.env.ANDROID_VERSION_NAME;
          const aabPath = 'client/android/app/build/outputs/bundle/release/app-release.aab';

          function base64url(value) {
            const buffer = Buffer.isBuffer(value) ? value : Buffer.from(value);
            return buffer.toString('base64url');
          }

          function redact(text) {
            return String(text)
              .replace(/-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----/g, '[redacted]')
              .slice(0, 500);
          }

          async function playMessage(response) {
            const text = await response.text();
            if (!text) return '';
            try {
              const json = JSON.parse(text);
              const status = json.error?.status || '';
              const message = json.error?.message || json.error_description || '';
              return redact([status, typeof message === 'string' ? message : ''].filter(Boolean).join(': '));
            } catch {
              return redact(text);
            }
          }

          async function accessToken(account) {
            const now = Math.floor(Date.now() / 1000);
            const header = base64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
            const payload = base64url(JSON.stringify({
              iss: account.client_email,
              scope: 'https://www.googleapis.com/auth/androidpublisher',
              aud: 'https://oauth2.googleapis.com/token',
              iat: now,
              exp: now + 3600,
            }));
            const unsigned = `${header}.${payload}`;
            const signer = createSign('RSA-SHA256');
            signer.update(unsigned);
            signer.end();
            const assertion = `${unsigned}.${base64url(signer.sign(account.private_key))}`;
            const response = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion,
              }),
            });
            if (!response.ok) {
              console.error(`Play service account was rejected (${response.status}). ${await playMessage(response)}`);
              process.exit(1);
            }
            const json = await response.json();
            if (!json.access_token) {
              console.error('Play token response had no access token.');
              process.exit(1);
            }
            return json.access_token;
          }

          const account = JSON.parse(readFileSync(process.env.PLAY_SA_PATH, 'utf8'));
          const token = await accessToken(account);
          const editResponse = await fetch(
            `https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${encodeURIComponent(packageName)}/edits`,
            {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: '{}',
            }
          );
          if (!editResponse.ok) {
            console.error(`Play edit failed (${editResponse.status}). ${await playMessage(editResponse)}`);
            process.exit(1);
          }
          const edit = await editResponse.json();
          const editId = edit.id;
          const bundleResponse = await fetch(
            `https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/${encodeURIComponent(packageName)}/edits/${encodeURIComponent(editId)}/bundles?uploadType=media`,
            {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/octet-stream',
              },
              body: readFileSync(aabPath),
            }
          );
          if (!bundleResponse.ok) {
            console.error(`Play bundle upload failed (${bundleResponse.status}). ${await playMessage(bundleResponse)}`);
            process.exit(1);
          }
          const bundle = await bundleResponse.json();
          if (String(bundle.versionCode) !== String(versionCode)) {
            console.error(`Play stored versionCode ${bundle.versionCode}, expected ${versionCode}. The edit was not committed.`);
            process.exit(1);
          }
          // Replaces the current internal-track release list with this build.
          const trackResponse = await fetch(
            `https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${encodeURIComponent(packageName)}/edits/${encodeURIComponent(editId)}/tracks/internal`,
            {
              method: 'PUT',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                track: 'internal',
                releases: [
                  {
                    name: `${versionName} (${versionCode})`,
                    versionCodes: [String(versionCode)],
                    status: 'completed',
                  },
                ],
              }),
            }
          );
          if (!trackResponse.ok) {
            console.error(`Play internal track update failed (${trackResponse.status}). ${await playMessage(trackResponse)} The edit was not committed.`);
            process.exit(1);
          }
          const commitResponse = await fetch(
            `https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${encodeURIComponent(packageName)}/edits/${encodeURIComponent(editId)}:commit`,
            {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}` },
            }
          );
          if (!commitResponse.ok) {
            console.error(`Play edit commit failed (${commitResponse.status}). ${await playMessage(commitResponse)}`);
            process.exit(1);
          }
          console.log(`Uploaded ${packageName} versionName ${versionName} versionCode ${versionCode} to the internal track.`);
          JS

      - name: Upload bundle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle-logs
          path: build-logs/*.log
          if-no-files-found: ignore

      - name: Delete the keystore, Play key, and web env
        if: always()
        run: |
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
          fi
          if [[ -n "${PLAY_SA_PATH:-}" ]]; then
            rm -f "$PLAY_SA_PATH"
          fi
          rm -f client/.env.production client/android/app/google-services.json client/android/local.properties
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" && -f "$ANDROID_KEYSTORE_PATH" ]] || [[ -n "${PLAY_SA_PATH:-}" && -f "$PLAY_SA_PATH" ]] || [[ -f client/.env.production || -f client/android/app/google-services.json ]]; then
            echo "::error::Failed to delete the keystore, Play service account, client/.env.production, or google-services.json"
            exit 1
          fi
