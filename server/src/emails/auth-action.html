<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{heading}}</title>
</head>
<body style="margin:0;padding:0;background:#e7ebef;-webkit-font-smoothing:antialiased">
<span style="display:none;max-height:0;overflow:hidden;opacity:0;color:#e7ebef">{{preheader}}</span>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;border-collapse:collapse;background:#e7ebef">
  <tr><td align="center" style="padding:26px 12px">

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:600px;border-collapse:collapse;background:#ffffff;border-radius:16px;overflow:hidden">
      <tr><td style="padding:0">

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;border-collapse:collapse">
          <tr><td style="padding:30px 40px 26px;background:#1b2733">
            <div style="font:700 20px/1 Arial,Helvetica,sans-serif;color:#ffffff;letter-spacing:-.01em">Metabolic&nbsp;OS</div>
            <div style="font:400 13px/1 Arial,Helvetica,sans-serif;color:#9fb0c2;margin-top:7px">The Master Metabolic Method</div>
          </td></tr>
        </table>

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;border-collapse:collapse">
          <tr><td style="padding:38px 40px 8px">
            <div style="font:700 28px/1.2 Arial,Helvetica,sans-serif;color:#1b2733;letter-spacing:-.02em">{{heading}}</div>
            <div style="font:400 15px/1.6 Arial,Helvetica,sans-serif;color:#64748b;margin-top:12px">{{body}}</div>
          </td></tr>
        </table>

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;border-collapse:collapse">
          <tr><td align="center" style="padding:20px 40px 40px">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse">
              <tr><td align="center" bgcolor="#1b2733" style="border-radius:11px"><a href="{{actionUrl}}" style="display:block;padding:15px 40px;font:700 15px/1 Arial,Helvetica,sans-serif;color:#ffffff;text-decoration:none;border-radius:11px">{{buttonLabel}}</a></td></tr>
            </table>
            <div style="font:400 12px/1.5 Arial,Helvetica,sans-serif;color:#94a3b8;margin-top:14px">If the button does not work, paste this link into your browser:<br><a href="{{actionUrl}}" style="color:#3b82f6;word-break:break-all">{{actionUrl}}</a></div>
          </td></tr>
        </table>

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;border-collapse:collapse">
          <tr><td style="padding:24px 40px 30px;background:#f4f6f8;border-top:1px solid #e4e9ee">
            <div style="font:400 11px/1.6 Arial,Helvetica,sans-serif;color:#94a3b8">Metabolic OS<br>{{footerNote}}</div>
          </td></tr>
        </table>

      </td></tr>
    </table>

  </td></tr>
</table>
</body>
</html>
